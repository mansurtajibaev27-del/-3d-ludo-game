<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Ludo</title>
  <style>
    body {
      margin: 0;
      background: #152238;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #ffd54f; }
    #board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      width: min(94vw, 480px);
      aspect-ratio: 1;
      margin: 16px auto;
      background: white;
      border: 4px solid #263238;
      box-sizing: border-box;
    }
    .cell {
      border: 1px solid #d8dce3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8px, 2.5vw, 15px);
      color: #222;
    }
    .red { background: #ff5252; }
    .green { background: #4caf50; }
    .yellow { background: #ffeb3b; }
    .blue { background: #42a5f5; }
    .home { background: #fff; }
    button {
      padding: 13px 25px;
      border: 0;
      border-radius: 12px;
      background: #ffd54f;
      font-size: 17px;
      font-weight: bold;
    }
    #result { font-size: 22px; margin: 12px; }
  </style>
</head>
<body>
  <h1>🎲 3D Ludo</h1>
  <p>Bizning Ludo loyihamiz!</p>
  <div id="board"></div>
  <div id="result">Zarni tashlang!</div>
  <button onclick="rollDice()">🎲 Zar tashlash</button>
  <script>
    const board = document.getElementById('board');
    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (r < 6 && c < 6) cell.classList.add('red');
        else if (r < 6 && c > 8) cell.classList.add('green');
        else if (r > 8 && c < 6) cell.classList.add('blue');
        else if (r > 8 && c > 8) cell.classList.add('yellow');
        else cell.classList.add('home');
        board.appendChild(cell);
      }
    }
    function rollDice() {
      const n = Math.floor(Math.random() * 6) + 1;
      document.getElementById('result').textContent =
        '🎲 Zar: ' + n;
    }
  </script>
</body>
</html>
